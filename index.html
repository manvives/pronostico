<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pronostico</title>
<meta name="description" content="Les pronos Premier Padel des gargouilles, par Man Vives Padel.">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070B16">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pronostico">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Pronostico v2 : fond nuit, couleurs de la chaîne (pêche, bleu, jaune balle) */
:root{
  --bg:#070B16; --bg2:#0B1122; --surface:#111A2E; --surface2:#0C1324; --line:#1F2B47; --line2:#24314F;
  --ink:#EEF1FA; --soft:#C9D1E8; --muted:#8E99B8; --dim:#7F8BAA;
  --acc:#2F5BFF; --acc-ink:#FFFFFF; --peach:#F6CFAE; --ball:#D6E64A; --ball-ink:#0A0F1F;
  --red:#FF5A3C; --red-soft:#FF8A73; --red-bg:#3A1414; --green:#7EE2A0; --green-bg:#16301F; --twitch:#A989FF;
  --display:"Anton","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100vh}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--peach)}a:hover{color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.disp{font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:.01em}
.label{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}

/* fond : lignes d'un terrain de padel */
.court{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.16;overflow:hidden}
.court i{position:absolute;background:var(--acc)}
.court .c1{left:50%;top:18vh;width:min(1500px,180vw);height:80vh;transform:translateX(-50%) perspective(900px) rotateX(58deg);border:3px solid var(--acc);background:none;border-radius:4px}
.court .c2{left:50%;top:18vh;width:3px;height:52vh;transform:translateX(-50%)}
.court .c3{left:0;right:0;top:44vh;height:3px}

/* en-tête */
.top{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:calc(12px + env(safe-area-inset-top,0px)) clamp(16px,4vw,48px) 12px;background:rgba(7,11,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid #1A2440}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand img{width:36px;height:36px;border-radius:9px}
.brand span{display:flex;flex-direction:column;line-height:1}
.brand b{font-family:var(--display);font-weight:400;font-size:24px;text-transform:uppercase}
.brand small{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--peach)}
.tabs{display:flex;gap:22px;flex:1 1 auto}
.tabs button{border:0;background:none;color:#AEB8D3;font-weight:600;font-size:15px;padding:8px 2px;border-bottom:2px solid transparent;display:flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:var(--acc)}
.tabs svg{display:none}
.pill-toggle{display:flex;background:var(--bg2);border:1px solid var(--line2);border-radius:999px;padding:4px}
.pill-toggle button{border:0;border-radius:999px;padding:8px 18px;font-weight:700;background:transparent;color:#AEB8D3;min-height:38px}
.pill-toggle button[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink)}
.me{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line2);border-radius:999px;padding:4px 14px 4px 4px;min-width:0}
.me img,.me .ava{width:32px;height:32px;border-radius:50%;background:var(--peach);color:var(--ball-ink);display:grid;place-items:center;font-weight:700;flex:0 0 auto;object-fit:cover}
.me .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.me .score{font-family:var(--display);font-size:18px;color:var(--ball);white-space:nowrap}
.menu-btn{border:1px solid var(--line2);background:var(--bg2);border-radius:999px;padding:8px 14px;font-weight:700;color:var(--soft)}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--twitch);color:var(--twitch);border-radius:4px;padding:1px 5px;white-space:nowrap}
.badge.red{border-color:var(--red-soft);color:var(--red-soft)}
.badge.gold{border-color:var(--ball);color:var(--ball)}
.usermenu{position:absolute;right:clamp(16px,4vw,48px);top:100%;margin-top:6px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:8px;display:flex;flex-direction:column;min-width:220px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.usermenu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px;font-weight:600}
.usermenu button:hover{background:var(--surface2)}
.install{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--peach);background:transparent;color:var(--peach);border-radius:999px;padding:7px 12px;font-weight:700;font-size:13px}

.wrap{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:28px clamp(16px,4vw,48px) 72px;display:flex;flex-direction:column;gap:26px}
#view{display:flex;flex-direction:column;gap:26px;min-width:0}
#account:empty{display:none}

/* tournoi */
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.hero .info{display:flex;flex-direction:column;gap:8px;min-width:0}
.hero h1{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(46px,7vw,96px);line-height:.95;overflow-wrap:anywhere}
.hero h1 span{color:var(--peach)}
.hero .meta{color:#AEB8D3;font-weight:600}
.live{display:inline-flex;align-items:center;gap:6px;background:var(--red-bg);color:var(--red-soft);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.06em}
.live i{width:8px;height:8px;border-radius:50%;background:var(--red)}
.tsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tsel select{border:1px solid var(--line2);background:var(--bg2);border-radius:999px;padding:6px 12px;font-weight:600;color:var(--soft);max-width:100%}
.rounds{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;max-width:100%}
.chip{flex:0 0 auto;border:1px solid var(--line2);background:transparent;color:var(--soft);border-radius:12px;padding:10px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:112px;min-height:58px}
.chip b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1;text-transform:uppercase}
.chip small{font-size:12px;font-weight:600;opacity:.8}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}

/* mise en page pronos */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-areas:"matches prize" "matches bonus" "matches top" "matches .";grid-template-rows:auto auto auto 1fr;gap:16px 28px;align-items:start}
.a-matches{grid-area:matches;display:flex;flex-direction:column;gap:14px;min-width:0}
.a-prize{grid-area:prize}.a-bonus{grid-area:bonus}.a-top{grid-area:top}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-head h2{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:30px}
.matches{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.match{padding:16px;display:flex;flex-direction:column;gap:10px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--line);color:var(--soft);white-space:nowrap}
.st.live,.st.late{background:var(--red-bg);color:var(--red-soft)}
.st.ok{background:var(--green-bg);color:var(--green)}
.st.done{background:#1A2440;color:#AEB8D3}
.side{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:10px;align-items:center;width:100%;min-height:60px;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);text-align:left}
.side:not(:disabled):hover{border-color:var(--acc)}
.side:disabled{cursor:default}
.side .seed{font-family:var(--display);color:var(--dim);font-size:16px;text-align:center}
.side .names{font-weight:700;min-width:0;overflow-wrap:anywhere}
.side .pair{display:flex;align-items:center;gap:10px;min-width:0}
.stk{display:flex;flex:0 0 auto;padding-left:4px}
.stk img,.stk i{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #fff;background:var(--peach);box-shadow:0 3px 8px rgba(0,0,0,.45);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;color:var(--ball-ink)}
.stk>*:first-child{transform:rotate(-6deg)}
.stk>*+*{margin-left:-12px;transform:rotate(5deg)}
.side.tbd .stk{display:none}
.side .prob{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.side .gain{font-family:var(--display);font-size:20px;min-width:52px;text-align:right;padding:0 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.side.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.side.sel .gain{background:var(--ball);color:var(--ball-ink)}
.side.won{border-color:var(--green);background:var(--green-bg)}
.side.tbd .names{color:var(--dim);font-weight:500;font-style:italic}
.score{font-size:13px;font-weight:600;color:#AEB8D3;font-variant-numeric:tabular-nums}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.ctrl .lbl{min-width:48px;font-weight:600}
.ctrl button{border:1px solid var(--line2);background:transparent;border-radius:8px;padding:6px 10px;font-weight:600;color:var(--ink);min-height:36px}
.ctrl button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.ctrl button:disabled{opacity:.4;cursor:default}
.votes{display:flex;flex-direction:column;gap:6px;padding-top:2px}
.votes .vl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:#AEB8D3}
.votes .bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line)}
.votes .bar i{display:block;background:var(--acc)}
.votes .bar u{display:block;flex:1;background:var(--peach)}
.verdict{font-size:13px;font-weight:600;border-radius:8px;padding:7px 10px}
.verdict.ok{background:var(--green-bg);color:var(--green)}
.verdict.ko{background:var(--red-bg);color:var(--red-soft)}
.verdict.info{background:var(--surface2);color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:36px 16px;border:1px dashed var(--line2);border-radius:var(--r);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty strong{color:var(--ink);font-size:17px}

/* lot à gagner */
.prize{padding:18px;display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center;border-color:var(--ball)}
.prize .ph{width:110px;height:140px;border-radius:12px;background:var(--surface2);border:1px solid var(--line2);display:grid;place-items:center;overflow:hidden}
.prize .ph img{width:100%;height:100%;object-fit:contain}
.prize .ph.none{border-style:dashed;font-size:11px;color:var(--muted);text-align:center;padding:6px}
.prize .t{font-family:var(--display);font-size:26px;line-height:1.02;text-transform:uppercase}
.prize .d{font-size:13px;color:#AEB8D3}

/* bonus */
.bonus{padding:18px;display:flex;flex-direction:column;gap:10px}
.bonus summary{list-style:none;display:flex;justify-content:space-between;align-items:baseline;cursor:pointer;gap:8px}
.bonus summary::-webkit-details-marker{display:none}
.bonus summary h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;text-transform:uppercase}
.bonus summary span{font-size:13px;font-weight:600;color:var(--muted)}
.bonus[open] summary{margin-bottom:6px}
.brow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;align-items:start;padding:10px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.brow .eff{font-family:var(--display);font-size:20px;overflow-wrap:anywhere;line-height:1.1;color:var(--ball);text-align:center;text-transform:uppercase}
.brow .bt{display:flex;flex-direction:column;gap:3px;min-width:0}
.brow .who{font-weight:700;font-size:14px}
.brow .txt{font-size:12px;color:var(--muted)}
.brow .bst{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--line);color:var(--soft)}
.brow.on{border-color:var(--ball)}
.brow.on .bst{background:var(--ball);color:var(--ball-ink)}
.brow.used{background:var(--red-bg);border-color:#6B2620}
.brow.used .eff{color:var(--red-soft)}
.brow.used .bst{background:var(--red);color:#fff}
.brow.used .txt{color:#E3A79B}
.nrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.nrow select{flex:1;min-width:0;border:1px solid var(--line2);background:var(--bg2);border-radius:8px;padding:7px}

/* top + classement */
.topl{padding:18px;display:flex;flex-direction:column;gap:10px}
.topl h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px;text-transform:uppercase}
.trow{display:grid;grid-template-columns:28px 32px minmax(0,1fr) auto;gap:10px;align-items:center}
.trow .r{font-family:var(--display);font-size:20px;text-align:center;color:var(--dim)}
.trow .r.g{color:var(--ball)}
.trow .n{font-weight:600;overflow-wrap:anywhere}
.trow .p{font-family:var(--display);font-size:18px}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--peach);color:var(--ball-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.board-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.board-head h1{margin:0;font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(40px,6vw,80px);line-height:.95}
.board-head h1 span{color:var(--peach)}
.board-ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btop{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:stretch}
.podium{padding:28px 20px 0;display:flex;align-items:flex-end;overflow:hidden}
.podium .g3{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:end}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.pod .pav{border-radius:50%;object-fit:cover;display:grid;place-items:center;color:var(--ball-ink);font-weight:700;font-size:22px;background:var(--peach)}
.pod .pn{font-weight:700;font-size:17px;overflow-wrap:anywhere}
.pod .pp{font-family:var(--display);font-size:24px}
.pod .blk{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:start center;padding-top:10px}
.pod .blk b{font-family:var(--display);font-weight:400;font-size:56px;line-height:1;color:var(--ball-ink)}
.blist{overflow:hidden}
.blist .lh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px}
.blist .lh h2{margin:0;font-family:var(--display);font-weight:400;font-size:26px;text-transform:uppercase}
.row{display:grid;grid-template-columns:48px 40px minmax(0,1fr) 100px 80px;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid #1A2440;font-variant-numeric:tabular-nums}
.row.hd{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--dim);padding-top:8px;padding-bottom:8px}
.row.me{background:rgba(246,207,174,.08)}
.row .r{font-family:var(--display);font-size:22px;color:var(--dim);text-align:center}
.row .av{width:40px;height:40px;font-size:14px}
.row .who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .acc{color:#AEB8D3}
.row .p{font-family:var(--display);font-size:22px;text-align:right}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}

/* connexion */
.login{padding:20px;display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;border-color:var(--acc)}
.login p{margin:0;font-weight:600;max-width:52ch}
.login small{display:block;font-weight:500;color:var(--muted);margin-top:4px}
.logins{display:flex;gap:8px;flex-wrap:wrap}
.btn-twitch{background:#9146ff;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center;min-height:44px}
.btn-google{background:#fff;color:#1f1f1f;border:0;border-radius:10px;padding:11px 16px;font-weight:700;display:inline-flex;gap:8px;align-items:center;min-height:44px}
.pseudo{padding:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-color:var(--peach)}
.pseudo label{width:100%;font-weight:700}
.pseudo input{flex:1;min-width:0;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;background:var(--bg2)}

/* règles + admin */
.doc{padding:24px;display:flex;flex-direction:column;gap:12px;max-width:860px}
.doc h2{margin:0;font-family:var(--display);font-weight:400;font-size:32px;text-transform:uppercase}
.doc h3{font-size:13px;margin:10px 0 0;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.doc p{margin:0;max-width:68ch}
.formula{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:600}
.rb{display:flex;flex-direction:column;gap:2px;border-left:3px solid var(--ball);padding-left:12px}
.rb span{color:var(--muted)}
.arow{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.arow .t{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.abtns,.bar{display:flex;gap:6px;flex-wrap:wrap}
.btn,.abtns button{border:1px solid var(--line2);background:var(--bg2);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;min-height:36px}
.btn.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.danger,.abtns .danger{color:var(--red-soft);border-color:var(--red-soft)}
.pill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:5px;background:var(--line);color:var(--muted)}
.pill.on{background:var(--green-bg);color:var(--green)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.field input{border:1px solid var(--line2);border-radius:8px;padding:8px 10px;background:var(--bg2)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#0A0F1F;padding:11px 16px;border-radius:10px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.err{background:var(--red);color:#fff}
.ios-tip{background:var(--surface);border:1px solid var(--line2);border-radius:var(--r);padding:14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.ios-tip p{margin:0;flex:1}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:13px}
.foot{text-align:center;font-size:12px;color:var(--dim);position:relative;z-index:1;padding:0 16px 96px}
.foot a{color:inherit}

@media (max-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr);grid-template-areas:"prize" "matches" "bonus" "top";grid-template-rows:none}
  .btop{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .top{gap:10px;flex-wrap:wrap;backdrop-filter:none;-webkit-backdrop-filter:none;background:#070B16}
  .top .brand{flex:1 1 auto}
  .install{padding:7px 9px}.install span{display:none}
  .brand b{font-size:21px}.brand small{display:none}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;gap:0;background:#0B1122;border-top:1px solid #1A2440;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabs button{flex:1;flex-direction:column;gap:2px;justify-content:center;min-height:58px;font-size:12px;border-bottom:0;border-top:2px solid transparent}
  .tabs button[aria-selected="true"]{border-top-color:var(--acc)}
  .tabs svg{display:block}
  .top .pill-toggle{order:5;width:100%}
  .top .pill-toggle button{flex:1}
  .me .nm,.me .badge{display:none}
  .matches{grid-template-columns:minmax(0,1fr)}
  .prize{grid-template-columns:80px minmax(0,1fr);padding:14px}

  .prize .t{font-size:22px}
  .row{grid-template-columns:34px 32px minmax(0,1fr) 64px;padding:10px 12px;gap:10px}

  .podium{padding:20px 10px 0}

@media (prefers-reduced-motion:no-preference){.side,.chip,.tabs button,.brow{transition:background .15s,border-color .15s,box-shadow .15s}}
</style>
</head>
<body>
<div class="court" aria-hidden="true"><i class="c1"></i><i class="c2"></i><i class="c3"></i></div>

<header class="top" id="top">
  <a class="brand" href="./" aria-label="Pronostico, accueil"><img src="icon-192.png" alt=""><span><b>Pronostico</b><small>MAN VIVES PADEL</small></span></a>
  <nav class="tabs" role="tablist" id="tabs" aria-label="Navigation">
    <button role="tab" data-tab="pronos" aria-selected="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.5 9.5c4 1.5 13 1.5 17 0M3.5 14.5c4-1.5 13-1.5 17 0"/></svg>Pronos</button>
    <button role="tab" data-tab="classement" aria-selected="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 21V10h8v11M3 21v-6h5M16 21v-8h5v8M2 21h20"/></svg>Classement</button>
    <button role="tab" data-tab="regles" aria-selected="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 3h11l3 3v15H5zM9 9h6M9 13h6M9 17h4"/></svg>Règles</button>
    <button role="tab" data-tab="admin" aria-selected="false" hidden id="adminTab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>Admin</button>
  </nav>
  <div class="pill-toggle" id="cats" role="group" aria-label="Tableau"></div>
  <button class="install" data-act="install" id="installBtn" aria-label="Installer l'appli" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M12 3v12m0 0 5-5m-5 5-5-5M4 21h16"/></svg><span>Installer</span></button>
  <div id="meBox"></div>
  <div class="usermenu" id="userMenu" hidden></div>
</header>

<div class="wrap">
  <div class="ios-tip" id="iosTip" hidden><p><strong>Installer Pronostico sur ton iPhone :</strong> touche le bouton Partager <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true" style="vertical-align:-2px"><path d="M12 15V3m0 0-4 4m4-4 4 4M5 11v9h14v-9"/></svg> en bas de Safari, puis « Sur l'écran d'accueil ».</p><button class="linkbtn" data-act="tipclose">Fermer</button></div>
  <div id="account"></div>
  <main id="view"><div class="empty">Chargement…</div></main>
</div>
<p class="foot">Pronostico · jeu gratuit des gargouilles · données Padel API · <a href="confidentialite.html">Confidentialité</a></p>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ======================= RÉGLAGES =======================
const SUPABASE_URL = "https://dbmxgrtknesjlqujgaoo.supabase.co";
const SUPABASE_KEY = "sb_publishable_WaU4-Ycm6M-Yc8-XH1FBXQ_ODoV9kkY";
// ========================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const BONUS=[
  {k:"triple",who:"Dylan Guichard",eff:"×3",short:"Dydy ×3",txt:"Vous avez été touché par la chatte à Dydy : ce match compte triple."},
  {k:"double",who:"Marc Phillipe",eff:"×2",short:"Philémon ×2",txt:"Philémon a décidé, par ses pouvoirs du divin chauve, de doubler les points du match."},
  {k:"chance",who:"Ju Seuringue",eff:"2e chance",short:"Ju 2e chance",txt:"Si ton prono est perdu, Julien te fait quand même prendre les points de la cote la plus basse gagnante."},
  {k:"neuille",who:"Olivier Guy",eff:"÷2",short:"Neuille",txt:"Le pouvoir du neuille : divise par deux les points d'un autre joueur sur deux matchs du premier tour tirés au hasard. Chaque joueur ne peut être neuillé qu'une fois par tournoi."},
  {k:"chat",who:"Black Cat",eff:"Chat noir",short:"Black Cat",txt:"Le Black Cat passe : un prono gagnant d'un autre joueur, tiré au hasard, ne lui rapporte plus rien. Chaque joueur ne peut le subir qu'une fois par tournoi."}
];
const MB=["triple","double","chance"];
const B=k=>BONUS.find(b=>b.k===k);
const RN={32:"32es",16:"16es",8:"8es",4:"Quarts",2:"Demies",1:"Finale"};
const RT={32:"32es de finale",16:"16es de finale",8:"8es de finale",4:"Quarts de finale",2:"Demi-finales",1:"Finale"};
const RL={32:"32e de finale",16:"16e de finale",8:"8e de finale",4:"Quart de finale",2:"Demi-finale",1:"Finale"};
const AVC=["#F6CFAE","#D6E64A","#C9B6FF","#9FE3D2","#E8A87C","#AEB8D3"];

const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const S={session:null,me:null,settings:{categories:["men"]},tournaments:[],tid:null,
  cat:/femmes|women/i.test(location.hash)?"women":/hommes|men/i.test(location.hash)?"men":(ls.get("pp-cat")==="women"?"women":"men"),
  round:null,matches:[],photos:{},preds:{},points:{},attacks:[],votes:{},board:[],allRows:null,boardAll:false,boardMode:"t",onlyF:false,
  tab:ls.get("pp-tab")||"pronos",bOpen:ls.get("pp-bopen")?ls.get("pp-bopen")!=="0":window.innerWidth>1000,adminList:null,busy:false,menu:false};

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtPts=n=>n+(Math.abs(n)>1?" pts":" pt");
function toast(msg,err){const t=document.getElementById("toast");t.textContent=msg;t.className="toast"+(err?" err":"");t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3500)}
function errMsg(e){return (e&&(e.message||e.error_description))||"Erreur inconnue"}
function initials(n){const s=String(n||"?").replace(/[^A-Za-zÀ-ÿ0-9 ]/g," ").trim().split(/\s+/);return ((s[0]||"?")[0]+(s[1]?s[1][0]:(s[0]||"")[1]||"")).toUpperCase()}
function hashColor(id){let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return AVC[h%AVC.length]}
function avatar(u,cls="av",style=""){return u.avatar_url?`<img class="${cls}" src="${esc(u.avatar_url)}" alt="" style="${style}" loading="lazy">`:`<span class="${cls}" aria-hidden="true" style="background:${hashColor(u.user_id||u.id)};${style}">${esc(initials(u.display_name))}</span>`}

// ---------- cotes ----------
const P=m=>[Math.max(m.pts1||0,50),Math.max(m.pts2||0,50)];
function prob(m,w){const[a,b]=P(m);return (w===1?a:b)/(a+b)}
function gain(m,w){return Math.round(10/prob(m,w))}
const setBonus=g=>Math.round(g*0.25);
const mult=k=>k==="triple"?3:k==="double"?2:1;

const tour=()=>S.tournaments.find(t=>t.id===S.tid);
function isOpen(m){const t=tour();return !!(t&&t.published&&m.status==="scheduled"&&m.team1&&m.team2&&(!m.scheduled_at||new Date(m.scheduled_at)>new Date()))}
const catMatches=()=>S.matches.filter(m=>m.category===S.cat);
const firstRound=()=>Math.max(0,...catMatches().map(m=>m.round));
const fmtD=(d,o)=>new Date(d).toLocaleDateString("fr-FR",{timeZone:"Europe/Paris",...o});
function when(m){
  if(!m.scheduled_at)return m.schedule_label||"Horaire à venir";
  const d=new Date(m.scheduled_at);
  return fmtD(d,{weekday:"short",day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit",timeZone:"Europe/Paris"});
}
function scoreText(m){const s=m.score;if(!s)return "";if(Array.isArray(s))return s.map(x=>`${x.team_1??""}-${x.team_2??""}`).join("  ");return String(s)}
const myId=()=>S.session?.user.id;

// ---------- chargement ----------
async function loadMe(token){
  if(!S.session){S.me=null;return}
  const{data,error}=await sb.rpc("refresh_me",{p_token:token||null});
  if(error){toast(errMsg(error),true);return}
  S.me=data;
}
async function loadTournaments(){
  const[{data:st},{data:ts,error}]=await Promise.all([
    sb.from("settings").select("*").maybeSingle(),
    sb.from("tournaments").select("*").order("start_date",{ascending:false})
  ]);
  if(st)S.settings=st;
  if(error){toast(errMsg(error),true);return}
  S.tournaments=ts||[];
  const vis=S.tournaments.filter(t=>t.published||S.me?.is_admin);
  const saved=+ls.get("pp-tid");
  if(!vis.find(t=>t.id===S.tid)){
    const live=vis.find(t=>t.status==="live")||[...vis].filter(t=>t.status==="pending").sort((a,b)=>(a.start_date||"").localeCompare(b.start_date||""))[0];
    S.tid=(vis.find(t=>t.id===saved&&t.status!=="finished")||live||vis.find(t=>t.id===saved)||vis[0]||{}).id||null;
  }
  if(!(S.settings.categories||[]).includes(S.cat))S.cat=(S.settings.categories||["men"])[0];
}
async function loadTournament(){
  if(!S.tid){S.matches=[];S.preds={};S.points={};S.attacks=[];S.board=[];S.votes={};return}
  const q=[
    sb.from("matches").select("*").eq("tournament_id",S.tid).order("round",{ascending:false}).order("idx"),
    sb.from("attacks").select("*").eq("tournament_id",S.tid),
    sb.rpc("leaderboard",{p_tournament:S.boardMode==="t"?S.tid:null,p_category:S.cat}),
    sb.rpc("match_votes",{p_tournament:S.tid})
  ];
  if(S.session){
    q.push(sb.from("predictions").select("*").eq("tournament_id",S.tid));
    q.push(sb.rpc("my_points",{p_tournament:S.tid}));
  }
  const r=await Promise.all(q);
  const e=r.find(x=>x.error);if(e)toast(errMsg(e.error),true);
  S.matches=r[0].data||[];S.attacks=r[1].data||[];S.board=r[2].data||[];
  S.votes={};(r[3].data||[]).forEach(v=>S.votes[v.match_id]=v);
  const pids=[...new Set(S.matches.flatMap(m=>[...(m.team1_ids||[]),...(m.team2_ids||[])]))];
  if(pids.length){const{data:pl}=await sb.from("players").select("id,name,photo_url").in("id",pids);S.photos={};(pl||[]).forEach(x=>S.photos[x.id]=x)}
  S.preds={};(r[4]?.data||[]).forEach(p=>S.preds[p.match_id]=p);
  S.points={};(r[5]?.data||[]).forEach(p=>S.points[p.match_id]=p);
  await loadAllBoard();
  const rounds=[...new Set(catMatches().map(m=>m.round))].sort((a,b)=>b-a);
  if(!rounds.includes(S.round)){
    S.round=rounds.find(rd=>catMatches().some(m=>m.round===rd&&(isOpen(m)||m.status==="live")))??rounds.find(rd=>catMatches().some(m=>m.round===rd&&!m.winner))??rounds[rounds.length-1]??null;
  }
}
async function reloadBoard(){
  const{data,error}=await sb.rpc("leaderboard",{p_tournament:S.boardMode==="t"?S.tid:null,p_category:S.cat});
  if(error)toast(errMsg(error),true);S.board=data||[];
  await loadAllBoard();
}
async function loadAllBoard(){
  if(!S.boardAll){S.allRows=null;return}
  const{data,error}=await sb.rpc("leaderboard",{p_tournament:S.boardMode==="t"?S.tid:null,p_category:"all"});
  if(error)toast(errMsg(error),true);S.allRows=data||[];
}

// ---------- en-tête ----------
const isTwitch=()=>!S.me||!["google","email","apple"].includes(S.me.provider);
function myTotal(){return Object.values(S.points).filter(p=>S.matches.find(m=>m.id===p.match_id)?.category===S.cat).reduce((a,p)=>a+(p.pts||0),0)}
function renderHeader(){
  document.getElementById("adminTab").hidden=!S.me?.is_admin;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  const cats=S.settings.categories||["men"];
  const ct=document.getElementById("cats");
  ct.hidden=cats.length<2;
  ct.innerHTML=cats.map(c=>`<button data-cat="${c}" aria-pressed="${S.cat===c}">${c==="women"?"Femmes":"Hommes"}</button>`).join("");
  const mb=document.getElementById("meBox");
  if(!S.session){mb.innerHTML=`<button class="menu-btn" data-act="gologin">Se connecter</button>`}
  else{
    const u={...S.me,user_id:myId(),display_name:S.me?.display_name||"…"};
    mb.innerHTML=`<button class="me" data-act="menu" aria-expanded="${S.menu}" aria-haspopup="true" style="cursor:pointer">${avatar(u,"ava")}<span class="nm">${esc(u.display_name)}</span>${S.me?.is_follower?'<span class="badge">Follower</span>':""}<span class="score">${fmtPts(myTotal())}</span></button>`;
  }
  const um=document.getElementById("userMenu");
  um.hidden=!S.menu||!S.session;
  if(S.session){
    const tw=isTwitch();
    um.innerHTML=(tw&&S.me&&!S.me.is_follower&&!S.me.is_admin?`<button data-act="login">Je viens de follow, revérifier</button>`:"")
      +(!tw?`<button data-act="rename">Changer de pseudo</button>`:"")
      +`<button data-act="logout">Déconnexion</button>`;
  }
  // bloc connexion / pseudo
  const acc=document.getElementById("account");
  if(!S.session){
    const inApp=/Instagram|FBAN|FBAV|Snapchat|TikTok|musical_ly|Twitter|LinkedInApp|Line\//i.test(navigator.userAgent);
    acc.innerHTML=`<section class="card login" id="loginCard"><p>Connecte-toi pour jouer et entrer dans le classement des gargouilles.<small>Twitch : badge Follower si tu suis la chaîne. Google : tu joues aussi, sans badge.${inApp?" Tu es dans le navigateur d'une appli : si la connexion bloque, ouvre le site dans Safari ou Chrome.":""}</small></p><div class="logins"><button class="btn-twitch" data-act="login"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 2 2 6v14h5v3h3l3-3h4l5-5V2H4zm16 12-3 3h-5l-3 3v-3H5V4h15v10zM15 7h2v5h-2V7zm-5 0h2v5h-2V7z"/></svg>Se connecter avec Twitch</button><button class="btn-google" data-act="login-google"><svg width="16" height="16" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.6 10.7l7.9-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.2-13.5-10l-7.9 6C6.6 42.6 14.6 48 24 48z"/></svg>Continuer avec Google</button></div></section>`;
  }else if(S.me&&!isTwitch()&&(!S.me.custom_name||S.renaming)){
    acc.innerHTML=`<form class="card pseudo" id="pseudoForm"><label for="pseudo">${S.me.custom_name?"Ton nouveau pseudo":"Choisis ton pseudo pour le classement"}</label><input id="pseudo" maxlength="20" minlength="3" required autocomplete="nickname" value="${S.me.custom_name?esc(S.me.display_name):""}" placeholder="Ex. LeSmasheur"><button class="btn primary" type="submit">Valider</button>${S.renaming?'<button class="btn" type="button" data-act="cancelrename">Annuler</button>':""}</form>`;
  }else acc.innerHTML="";
}

// ---------- blocs ----------
function myBonusMatch(k){return Object.values(S.preds).find(p=>p.bonus===k&&(p.category||"men")===S.cat)}
function myAttack(kind){return S.attacks.find(a=>a.kind===kind&&a.attacker===myId()&&(a.category||"men")===S.cat)}
function nameOf(uid){const r=S.board.find(x=>x.user_id===uid)||(S.allRows||[]).find(x=>x.user_id===uid);return r?r.display_name:"un joueur"}
function matchLabel(id){const m=S.matches.find(x=>x.id===id);return m?`${RN[m.round]||""} : ${m.team1||"?"} – ${m.team2||"?"}`:"un match"}

function heroHtml(){
  const vis=S.tournaments.filter(t=>t.published||S.me?.is_admin);
  const t=tour();
  if(!t)return "";
  const nm=esc(t.name).replace(/\s(\S+)$/,' <span>$1</span>');
  const dates=t.start_date?`du ${fmtD(t.start_date,{day:"numeric",month:"short"})} au ${fmtD(t.end_date,{day:"numeric",month:"long"})}`:"";
  return `<section class="hero"><div class="info">
    <div class="tsel">${t.status==="live"?'<span class="live"><i></i>EN DIRECT</span>':t.status==="finished"?'<span class="st done">Terminé</span>':'<span class="st">À venir</span>'}
    ${vis.length>1?`<label for="tournament" class="vh">Changer de tournoi</label><select id="tournament">${vis.map(x=>`<option value="${x.id}" ${x.id===S.tid?"selected":""}>${esc(x.name)}${x.published?"":" (caché)"}</option>`).join("")}</select>`:`<span class="label">${esc((t.level||"").toUpperCase())}</span>`}</div>
    <h1>${nm}</h1>
    <span class="meta">${esc(t.location||"")}${t.location&&dates?" · ":""}${dates} · tableau ${S.cat==="women"?"féminin":"masculin"}</span>
  </div>${roundsHtml()}</section>`;
}
function roundsHtml(){
  const ms=catMatches();if(!ms.length)return "";
  const rounds=[...new Set(ms.map(m=>m.round))].sort((a,b)=>b-a);
  return `<div class="rounds" role="group" aria-label="Tours">${rounds.map(r=>{
    const rm=ms.filter(m=>m.round===r);const ready=rm.filter(m=>m.team1&&m.team2);
    const done=rm.length&&rm.every(m=>m.winner||["walkover","bye","not_played"].includes(m.status));
    const mine=ready.filter(m=>S.preds[m.id]).length;
    const first=rm.map(m=>m.scheduled_at).filter(Boolean).sort()[0];
    const sub=done?"terminé":rm.some(m=>m.status==="live")?"en cours":S.session&&ready.length?`${mine}/${ready.length} pronos`:first?fmtD(first,{weekday:"short",day:"numeric"}):"à venir";
    return `<button class="chip" data-round="${r}" aria-pressed="${S.round===r}"><b>${RN[r]||r}</b><small>${sub}</small></button>`}).join("")}</div>`;
}
function prizeHtml(){
  const st=S.settings;if(!st.prize_title)return "";
  const img=st.prize_image?`<div class="ph"><img src="${esc(st.prize_image)}" alt="${esc(st.prize_title)}" onerror="this.parentNode.classList.add('none');this.replaceWith('Photo du lot')"></div>`:`<div class="ph none">Photo du lot</div>`;
  return `<section class="card prize a-prize">${img}<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="label" style="color:var(--ball)">À gagner</span><span class="t">${esc(st.prize_title)}</span>${st.prize_text?`<span class="d">${esc(st.prize_text)}</span>`:""}</div></section>`;
}
function bonusHtml(){
  if(!S.session)return "";
  const others=S.board.filter(r=>r.user_id!==myId());
  const fr=firstRound(),neuilleOk=catMatches().some(m=>m.round===fr&&isOpen(m));
  const hitN=new Set(S.attacks.filter(a=>a.kind==="neuille"&&(a.category||"men")===S.cat).map(a=>a.target));
  const hitC=new Set(S.attacks.filter(a=>a.kind==="chat"&&(a.category||"men")===S.cat).map(a=>a.target));
  let left=0;
  const rows=BONUS.map(b=>{
    let cls="",st,ctl="";
    if(MB.includes(b.k)){
      const p=myBonusMatch(b.k);
      if(!p){st="Disponible";left++}
      else{const m=S.matches.find(x=>x.id===p.match_id);const pt=S.points[p.match_id];
        if(m&&isOpen(m)){cls="on";st="Placé · "+(RN[m.round]||"")+" "+(m.team1||"")}
        else{cls="used";st=pt?`Utilisé · +${pt.pts} pts`:"Utilisé · match en cours"}}
    }else{
      const a=myAttack(b.k);
      if(a){cls="used";st=(b.k==="neuille"?"Utilisé sur ":"Lâché sur ")+nameOf(a.target);ctl=`<span class="txt">${a.match_ids.map(matchLabel).map(esc).join("<br>")}</span>`}
      else{
        left++;st="Disponible";
        const list=b.k==="neuille"?(neuilleOk?others.filter(x=>!hitN.has(x.user_id)):[]):others.filter(x=>x.good>0&&!hitC.has(x.user_id));
        ctl=`<div class="nrow"><label for="${b.k}T" class="vh">Joueur visé</label><select id="${b.k}T" ${list.length?"":"disabled"}>${list.map(x=>`<option value="${x.user_id}">${esc(x.display_name)}</option>`).join("")||"<option>Personne à viser</option>"}</select><button class="btn primary" data-attack="${b.k}" ${list.length?"":"disabled"}>${b.k==="neuille"?"Neuiller":"Lâcher"}</button></div>`
          +(b.k==="neuille"&&!neuilleOk?`<span class="txt">Seulement avant la fin du premier tour.</span>`:"");
      }
    }
    return `<div class="brow ${cls}"><span class="eff">${b.eff}</span><div class="bt"><span class="who">Bonus ${b.who}</span><span class="txt">${b.txt}</span><span class="bst">${esc(st)}</span>${ctl}</div></div>`;
  }).join("");
  return `<details class="card bonus a-bonus" id="bdet" ${S.bOpen?"open":""}><summary><h2>Tes bonus</h2><span>${left}/5 dispo</span></summary>
    <p class="note">Une fois par tournoi, un seul bonus par match. Les ×3, ×2 et 2e chance se placent depuis un match où tu as fait ton prono.</p>${rows}</details>`;
}
function topHtml(){
  const rows=S.board.slice(0,5);
  return `<section class="card topl a-top"><div class="sec-head"><h2>Top gargouilles</h2><button class="linkbtn" data-tab="classement">Tout voir</button></div>
    ${rows.length?rows.map((x,i)=>`<div class="trow"><span class="r ${i<3&&x.decided?"g":""}">${i+1}</span>${avatar(x)}<span class="n">${esc(x.display_name)}</span><span class="p">${x.points}</span></div>`).join(""):`<p class="note">Personne n'a encore pronostiqué. Sois la première gargouille !</p>`}</section>`;
}

function stickers(ids,name){
  const parts=String(name||"").split(" / ");
  return `<span class="stk" aria-hidden="true">${(ids||[]).slice(0,2).map((id,i)=>{const p=S.photos[id];const nm=p?.name||parts[i]||"";
    return p?.photo_url?`<img src="${esc(p.photo_url)}" alt="" loading="lazy" onerror="this.outerHTML='<i>${esc(initials(nm)).replace(/'/g,"")}</i>'">`:`<i style="background:${hashColor(id)}">${esc(initials(nm))}</i>`}).join("")}</span>`;
}
function matchHtml(m){
  const pick=S.preds[m.id],open=isOpen(m),bk=pick?.bonus||null,res=m.winner,pt=S.points[m.id],known=m.team1&&m.team2;
  const voided=["walkover","bye","not_played"].includes(m.status);
  let st,sc;
  if(res){st=m.status==="retired"?"Abandon":"Terminé";sc="done"}
  else if(voided){st="Annulé";sc="done"}
  else if(m.status==="live"){st=pick?"En cours":"En cours · trop tard";sc="live"}
  else if(open){st=pick?"Prono enregistré":"À pronostiquer";sc=pick?"ok":""}
  else if(known){st=pick?"Verrouillé":"Trop tard";sc=pick?"done":"late"}
  else{st="En attente";sc=""}
  let c=`<article class="card match"><div class="mhead"><span class="label">${esc(when(m))}</span><span class="st ${sc}">${st}</span></div>`;
  [1,2].forEach(w=>{
    const name=w===1?m.team1:m.team2,seed=w===1?m.seed1:m.seed2;
    if(!name){c+=`<button class="side tbd" disabled><span class="seed">–</span><span class="names">À déterminer</span><span></span><span></span></button>`;return}
    const pr=known?Math.round(prob(m,w)*100)+"%":"",g=known?"+"+gain(m,w)*mult(bk):"";
    const cls=["side",pick?.winner===w?"sel":"",res===w?"won":""].join(" ");
    c+=`<button class="${cls}" data-pick="${m.id}|${w}" ${open?"":"disabled"} aria-pressed="${pick?.winner===w}"><span class="seed">${esc(seed||"")}</span><span class="pair">${stickers(w===1?m.team1_ids:m.team2_ids,name)}<span class="names">${esc(name)}</span></span><span class="prob">${pr}</span><span class="gain">${g}</span></button>`;
  });
  if(scoreText(m))c+=`<span class="score">Score : ${esc(scoreText(m))}</span>`;
  if(pick&&open){
    const g=gain(m,pick.winner);
    c+=`<div class="ctrl"><span class="lbl">Sets</span>`+["2-0","2-1"].map(s=>`<button data-sets="${m.id}|${s}" aria-pressed="${pick.sets===s}">${s}</button>`).join("")+`<span>+${setBonus(g)*mult(bk)} si exact</span></div>`;
    c+=`<div class="ctrl"><span class="lbl">Bonus</span>`+MB.map(k=>{const other=myBonusMatch(k);const here=bk===k;const lockedElsewhere=other&&other.match_id!==m.id&&!isOpen(S.matches.find(x=>x.id===other.match_id)||{});
      return `<button data-bonus="${m.id}|${k}" aria-pressed="${here}" ${lockedElsewhere?"disabled":""}>${B(k).short}</button>`}).join("")+`</div>`;
  }
  const v=S.votes[m.id];
  if(known&&v&&(v.v1+v.v2)>0){
    const p1=Math.round(v.v1*100/(v.v1+v.v2));
    c+=`<div class="votes"><div class="vl"><span>${p1}% des gargouilles</span><span>${100-p1}%</span></div><div class="bar" aria-hidden="true"><i style="width:${p1}%"></i><u></u></div></div>`;
  }
  const hit=S.attacks.filter(a=>a.target===myId()&&a.match_ids.includes(m.id));
  if(hit.length)c+=hit.map(a=>`<div class="verdict ko">${a.kind==="neuille"?"Neuillé par":"Black Cat de"} ${esc(nameOf(a.attacker))}${a.kind==="neuille"?" : points ÷2":" : prono annulé"}</div>`).join("");
  if(pt){
    if(pt.good)c+=`<div class="verdict ok">Bien vu : +${pt.pts} pts${pick?.sets&&pick.sets===m.sets?" · score exact":""}${bk&&bk!=="chance"?" · "+B(bk).short:""}${pt.halved?" · neuillé":""}${pt.cancelled?" · annulé par le Black Cat":""}</div>`;
    else if(bk==="chance")c+=`<div class="verdict ok">Prono perdu, mais Ju te sauve : +${pt.pts} pts</div>`;
    else c+=`<div class="verdict ko">Raté sur ce match${bk?" · bonus "+B(bk).short+" perdu":""}</div>`;
  }else if(S.session&&!pick&&known&&!open&&!voided)c+=`<div class="verdict info">${res?"Pas de prono sur ce match":"Les joueurs sont sur le terrain : trop tard pour pronostiquer"}</div>`;
  else if(voided&&pick)c+=`<div class="verdict info">Match non joué : prono sans effet</div>`;
  return c+"</article>";
}

function viewPronos(){
  if(!S.tid)return `<div class="empty"><strong>Pas encore de tournoi ouvert</strong><span>Les pronos ouvrent dès que le tableau final du prochain tournoi est publié.</span></div>`;
  const ms=catMatches();
  let h=heroHtml();
  if(!ms.length)return h+`<div class="empty"><strong>${S.cat==="women"?"Le tableau féminin n'est pas encore sorti":"Le tableau n'est pas encore sorti"}</strong><span>Il apparaîtra ici automatiquement dès sa publication.</span></div>`;
  const list=ms.filter(m=>m.round===S.round);
  const ready=list.filter(m=>m.team1&&m.team2);
  h+=`<div class="layout"><section class="a-matches" aria-label="Matchs"><div class="sec-head"><h2>${RT[S.round]||""}</h2><span class="note">${S.session?`${ready.filter(m=>S.preds[m.id]).length} pronos sur ${ready.length} · `:""}les pronos ferment dès que les joueurs entrent sur le terrain</span></div>
    <div class="matches">${list.map(matchHtml).join("")}</div></section>
    ${prizeHtml()}${bonusHtml()}${topHtml()}</div>`;
  return h;
}

    <div class="row hd"><span>#</span><span></span><span>JOUEUR</span><span class="acc">BONS PRONOS</span><span style="text-align:right">POINTS</span></div>`;
  if(!rows.length)h+=`<div class="row"><span></span><span></span><span class="note">Personne n'a encore pronostiqué. Sois la première gargouille !</span><span></span><span></span></div>`;
  rest.forEach((x,k)=>{const rank=(podium?4:1)+k;h+=`<div class="row ${x.user_id===myId()?"me":""}"><span class="r">${rank}</span>${avatar(x)}<span class="who">${esc(x.display_name)}${x.is_follower?'<span class="badge">Follower</span>':""}${x.neuilled?'<span class="badge red">Neuillé</span>':""}${x.catted?'<span class="badge red">Black Cat</span>':""}</span><span class="acc">${x.good}/${x.decided}</span><span class="p">${x.points}</span></div>`});
  if(podium&&!rest.length)h+=`<div class="row"><span></span><span></span><span class="note">Seulement 3 gargouilles pour l'instant.</span><span></span><span></span></div>`;
  return h+"</section>";

  <p>Pronostique le vainqueur de chaque match du tableau final, puis le score en sets. Dès que les joueurs entrent sur le terrain, le match est verrouillé : trop tard pour pronostiquer ou changer d'avis.</p>
  <p>Le tableau Hommes et le tableau Femmes sont deux jeux séparés : chacun a ses pronos, ses 5 bonus et son propre classement. Le classement Général additionne les deux.</p>
  <h3>Les cotes</h3><div class="formula">Chance de victoire = points FIP de la paire ÷ (points paire + points adversaires)</div>
  <h3>Les points</h3><div class="formula">Bon vainqueur = 10 ÷ chance de victoire · Score en sets exact = +25 %</div>
  <p>Exemple : un favori à 90 % rapporte 11 pts, l'exploit à 10 % rapporte 100 pts. Un match à 50/50 rapporte 20 pts.</p>
  <h3>Les bonus</h3><p>Chaque bonus s'utilise une fois par tournoi et par tableau, et un seul par match. Tu peux déplacer un bonus tant que le match n'a pas commencé.</p>
  ${BONUS.map(b=>`<div class="rb"><strong>Bonus ${b.who} · ${b.eff}</strong><span>${b.txt}</span></div>`).join("")}

  <h3>Matchs non joués</h3><p>Forfait avant le match : le prono ne compte pas. Abandon en cours de match : le vainqueur compte, sans bonus de score exact.</p>
  <h3>Classement et lots</h3><p>Un classement par tournoi et un sur la saison. Le lot du tournoi est affiché sur le site. La participation est gratuite.</p></section>`;

// ---------- actions ----------
async function savePred(mid,patch){
  const cur=S.preds[mid];
  const row={user_id:myId(),match_id:mid,winner:cur?.winner,sets:cur?.sets??null,bonus:cur?.bonus??null,...patch};
  const{data,error}=await sb.from("predictions").upsert(row,{onConflict:"user_id,match_id"}).select().single();
  if(error)throw error;
  S.preds[mid]=data;
  const{data:v}=await sb.rpc("match_votes",{p_tournament:S.tid});if(v){S.votes={};v.forEach(x=>S.votes[x.match_id]=x)}
}
async function act(fn,okMsg){
  if(S.busy)return;S.busy=true;
  try{await fn();if(okMsg)toast(okMsg)}catch(e){toast(errMsg(e),true)}finally{S.busy=false;render()}
}
async function login(provider="twitch"){
  const redirectTo=location.origin+location.pathname;
  const options=provider==="twitch"?{redirectTo,scopes:"user:read:follows"}:{redirectTo};
  const{error}=await sb.auth.signInWithOAuth({provider,options});
  if(error)toast(errMsg(error),true);
}
function setCat(c){S.cat=c;S.round=null;ls.set("pp-cat",c);history.replaceState(null,"",location.pathname+(c==="women"?"#femmes":"#hommes"))}

document.addEventListener("click",e=>{
  if(S.menu&&!e.target.closest("#userMenu")&&!e.target.closest('[data-act="menu"]')){S.menu=false;renderHeader()}
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.tab){S.tab=d.tab;ls.set("pp-tab",S.tab);render();window.scrollTo({top:0});return}
  if(d.act==="menu"){S.menu=!S.menu;renderHeader();return}
  if(d.act==="gologin"){document.getElementById("loginCard")?.scrollIntoView({behavior:"smooth",block:"center"});return}
  if(d.act==="login"){S.menu=false;login("twitch");return}
  if(d.act==="login-google"){login("google");return}
  if(d.act==="rename"){S.menu=false;S.renaming=true;render();setTimeout(()=>document.getElementById("pseudo")?.focus(),0);return}
  if(d.act==="cancelrename"){S.renaming=false;render();return}
  if(d.act==="install"){installApp();return}
  if(d.act==="tipclose"){document.getElementById("iosTip").hidden=true;return}
  if(d.act==="logout"){S.menu=false;act(async()=>{await sb.auth.signOut();S.session=null;S.me=null;await loadTournaments();await loadTournament()});return}
  if(d.cat){if(d.cat===S.cat)return;setCat(d.cat);S.boardAll=false;render();act(loadTournament);return}
  if(d.round){S.round=+d.round;render();return}
  if(d.board){S.boardMode=d.board;act(reloadBoard);return}
  if(d.bcat){
    if(d.bcat==="all"){S.boardAll=true;act(loadAllBoard);return}
    S.boardAll=false;
    if(d.bcat!==S.cat){setCat(d.bcat);act(loadTournament)}else render();
    return}
  if(d.pick&&!S.session){toast("Connecte-toi (Twitch ou Google) pour faire tes pronos",true);document.getElementById("loginCard")?.scrollIntoView({behavior:"smooth",block:"center"});return}
  if(d.pick){const[mid,w]=d.pick.split("|").map(Number);const cur=S.preds[mid];
    act(()=>savePred(mid,{winner:w,sets:cur&&cur.winner===w?cur.sets:null}));return}
  if(d.sets){const[mid,s]=d.sets.split("|");act(()=>savePred(+mid,{sets:s}));return}
  if(d.bonus){const[mid,k]=d.bonus.split("|");const m=+mid;
    act(async()=>{
      if(S.preds[m].bonus===k){await savePred(m,{bonus:null});return}
      const other=myBonusMatch(k);
      if(other&&other.match_id!==m)await savePred(other.match_id,{bonus:null});
      await savePred(m,{bonus:k});
    });return}
  if(d.attack){const sel=document.getElementById(d.attack+"T");if(!sel||!sel.value)return;
    act(async()=>{
      const{error}=await sb.rpc(d.attack==="neuille"?"use_neuille":"use_black_cat",{p_tournament:S.tid,p_target:sel.value,p_category:S.cat});
      if(error)throw error;await loadTournament();
    },d.attack==="neuille"?"Neuille lancé !":"Le Black Cat est passé…");return}
  // admin
  if(d.admin==="rankings"){act(async()=>{const{data,error}=await sb.rpc("admin_sync_rankings",{p_category:d.rcat});if(error)throw error;toast(data+(d.rcat==="women"?" joueuses":" joueurs")+" mis à jour")});return}
  if(d.admin==="photos"){act(async()=>{const{data,error}=await sb.rpc("admin_fetch_photos",{p_tournament:S.tid});if(error)throw error;await loadTournament();toast(data?data+" fiches joueurs vérifiées":"Toutes les photos disponibles sont déjà là")});return}
  if(d.admin==="list"){act(async()=>{const{data,error}=await sb.rpc("admin_list_tournaments");if(error)throw error;S.adminList=data});return}
  if(d.import){act(async()=>{const{data,error}=await sb.rpc("admin_sync",{p_tournament:+d.import});if(error)throw error;
    await loadTournaments();if(!S.tid)S.tid=+d.import;await loadTournament();if(S.adminList)S.adminList.forEach(x=>{if(x.id==d.import)x.imported=true});toast(data+" matchs importés")});return}
  if(d.pub){const[id,p]=d.pub.split("|");act(async()=>{const{error}=await sb.rpc("admin_publish",{p_tournament:+id,p_published:p==="1"});if(error)throw error;await loadTournaments();await loadTournament()},p==="1"?"Tournoi publié":"Tournoi caché");return}
  if(d.del){if(t.dataset.confirm!=="1"){t.dataset.confirm="1";t.textContent="Confirmer la suppression";return}
    act(async()=>{const{error}=await sb.rpc("admin_delete_tournament",{p_tournament:+d.del});if(error)throw error;S.tid=null;await loadTournaments();await loadTournament()},"Tournoi supprimé");return}
  if(d.res){const[mid,w,s]=d.res.split("|");act(async()=>{const{error}=await sb.rpc("admin_set_result",{p_match:+mid,p_winner:+w,p_sets:s});if(error)throw error;await loadTournament()},"Résultat enregistré");return}
  if(d.auto){act(async()=>{const{error}=await sb.rpc("admin_reset_result",{p_match:+d.auto});if(error)throw error;await loadTournament()},"Résultat remis en automatique");return}
});
document.addEventListener("submit",e=>{
  if(e.target.id==="pseudoForm"){
    e.preventDefault();
    const v=document.getElementById("pseudo").value;
    act(async()=>{const{data,error}=await sb.rpc("set_pseudo",{p_name:v});if(error)throw error;S.me=data;S.renaming=false;await reloadBoard()},"Pseudo enregistré");
  }
  if(e.target.id==="prizeForm"){
    e.preventDefault();
    const v=id=>document.getElementById(id).value;
    act(async()=>{const{error}=await sb.rpc("admin_set_prize",{p_title:v("prT"),p_text:v("prD"),p_image:v("prI")});if(error)throw error;await loadTournaments()},"Lot enregistré");
  }
});
document.addEventListener("change",e=>{
  if(e.target.id==="tournament"){S.tid=+e.target.value;ls.set("pp-tid",S.tid);S.round=null;act(loadTournament)}
  if(e.target.id==="onlyF"){S.onlyF=e.target.checked;render()}
});
document.addEventListener("toggle",e=>{if(e.target.id==="bdet"){S.bOpen=e.target.open;ls.set("pp-bopen",S.bOpen?"1":"0")}},true);

// ---------- appli installable ----------
let deferredPrompt=null;
const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!/CriOS|FxiOS|EdgiOS/i.test(navigator.userAgent);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(!standalone)document.getElementById("installBtn").hidden=false});
window.addEventListener("appinstalled",()=>{document.getElementById("installBtn").hidden=true;toast("Pronostico est installé sur ton écran d'accueil")});
if(isIOS&&!standalone)document.getElementById("installBtn").hidden=false;
async function installApp(){
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;document.getElementById("installBtn").hidden=true;return}
  if(isIOS){const t=document.getElementById("iosTip");t.hidden=false;t.scrollIntoView({behavior:"smooth",block:"center"});return}
  toast("Ouvre le menu de ton navigateur puis « Installer l'application » ou « Ajouter à l'écran d'accueil »");
}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

// ---------- démarrage ----------
let started=false;
sb.auth.onAuthStateChange((event,session)=>{
  const was=S.session?.user.id;S.session=session;
  if(!started)return;
  if(session?.provider_token&&event==="SIGNED_IN"){
    setTimeout(()=>act(async()=>{await loadMe(session.provider_token);await loadTournaments();await loadTournament()},"Connecté"),0);
  }else if((session?.user.id)!==was){
    setTimeout(()=>act(async()=>{await loadMe();await loadTournaments();await loadTournament()}),0);
  }
});
(async()=>{
  const{data}=await sb.auth.getSession();S.session=data.session;
  try{
    await loadMe(S.session?.provider_token);
    await loadTournaments();await loadTournament();
  }catch(e){toast(errMsg(e),true)}
  started=true;render();
  if(location.hash.includes("access_token"))history.replaceState(null,"",location.pathname);
  setInterval(()=>{if(document.visibilityState==="visible"&&!S.busy&&S.tab!=="admin")loadTournament().then(render).catch(()=>{})},60000);
})();
</script>
</body>
</html>
